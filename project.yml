name: Dogbody
options:
  deploymentTarget:
    macOS: "13.1"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: 6.7.1

targets:
  Dogbody:
    type: application
    platform: macOS
    sources:
      - path: Dogbody
        excludes:
          - "Info.plist"
      - path: Dogbody/Info.plist
        buildPhase: none
    dependencies:
      - package: GRDB
      - package: RiveRuntime
    info:
      path: Dogbody/Info.plist
      properties:
        CFBundleName: Jot
        CFBundleDisplayName: Jot
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "13.1"
        NSHumanReadableCopyright: "Copyright (c) 2026 Jot"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogbody.Dogbody
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
